version: 2.1

workflows:
  pr-review-workflow:
    jobs:
      - pr-review-with-tracking:
          context: 
            - circleci-agents 

jobs:
  pr-review-with-tracking:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    steps:
     - checkout:
         method: blobless
      
      # Install Claude Code CLI 
      - run:
          name: Install Claude Code CLI
          command: |
            # Use the native installer like the docs recommend
            curl -fsSL https://claude.ai/install.sh | bash
            # Add to PATH for this session
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
            
      # Install GitHub CLI
      - run:
          name: Install GitHub CLI
          command: |
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh -y
      
      # Create .claude directory and settings
      - run:
          name: Setup Claude Code configuration
          command: |
            mkdir -p ~/.claude
            cat > ~/.claude/settings.json \<< 'EOF'
            {
              "mcpServers": {
                "github": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-github"],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "$GITHUB_PERSONAL_ACCESS_TOKEN"
                  }
                }
              }
            }
            EOF
            
      # Install the GitHub MCP server
      - run:
          name: Install GitHub MCP server
          command: |
            npm install -g @modelcontextprotocol/server-github
            
      # Authenticate GitHub CLI
      - run:
          name: Authenticate GitHub CLI
          command: |
            # Debug: Check if token exists (without printing it)
            if [ -z "$GITHUB_PERSONAL_ACCESS_TOKEN" ]; then
              echo "ERROR: GITHUB_PERSONAL_ACCESS_TOKEN is not set"
              exit 1
            else
              echo "GITHUB_PERSONAL_ACCESS_TOKEN is set (length: ${#GITHUB_PERSONAL_ACCESS_TOKEN})"
            fi
            
            # Unset the automatic GITHUB_TOKEN to avoid conflicts
            unset GITHUB_TOKEN
            
            # Use our personal access token instead
            echo "Authenticating with GitHub CLI..."
            echo $GITHUB_PERSONAL_ACCESS_TOKEN | gh auth login --with-token
            
            # Verify authentication worked
            gh auth status
            
      # Create prompt file for Claude
      - run:
          name: Create review prompt
          command: |
            cat > /tmp/review_prompt.txt \<< 'EOF'
            Please perform a comprehensive code review of this GitHub Pull Request: REPLACE_PR_URL
            
            Focus on these areas:
            
            1. **Code Quality**
               - Clean code principles and best practices
               - Proper error handling and edge cases
               - Code readability and maintainability
               
            2. **Security**
               - Check for potential security vulnerabilities
               - Validate input sanitization
               - Review authentication/authorization logic
               
            3. **Performance**
               - Identify potential performance bottlenecks
               - Review database queries for efficiency
               - Check for memory leaks or resource issues
               
            4. **Testing**
               - Verify adequate test coverage
               - Review test quality and edge cases
               - Check for missing test scenarios
               
            5. **Documentation**
               - Ensure code is properly documented
               - Verify README updates for new features
               - Check API documentation accuracy
               
            Use the GitHub MCP server tools to:
            - Get the PR details and diff
            - Create inline comments for specific issues
            - Add a progress tracking comment with checkboxes
            - Update the tracking comment when complete
            
            Provide detailed feedback using inline comments for specific issues.
            Use top-level comments for general observations or praise.
            EOF

      # Run Claude Code for PR review
      - run:
          name: Run Claude Code PR Review
          command: |
            source $BASH_ENV
            
            PR_URL="<< pipeline.event.context.github.pr_url >>"
            echo "PR URL: $PR_URL"
            
            # Replace the placeholder with the actual PR URL
            sed -i "s|REPLACE_PR_URL|$PR_URL|g" /tmp/review_prompt.txt
            
            # Debug: Check MCP configuration
            echo "Checking Claude configuration..."
            ls -la ~/.claude/
            echo "MCP settings:"
            cat ~/.claude/settings.json
            
            # Test if GitHub MCP server is accessible
            echo "Testing GitHub MCP server..."
            npx -y @modelcontextprotocol/server-github --help || echo "GitHub MCP server test failed"
            
            # Run Claude with MCP debugging enabled
            echo "Starting Claude Code review with MCP debugging..."
            claude --mcp-debug -p "$(cat /tmp/review_prompt.txt)" > /tmp/claude_output.txt 2>&1
            
            # Display the results
            echo "Claude Code review completed. Output:"
            echo "=================================="
            cat /tmp/claude_output.txt
            echo "=================================="
            3. **Performance**
               - Identify potential performance bottlenecks
               - Review database queries for efficiency
               - Check for memory leaks or resource issues
               
            4. **Testing**
               - Verify adequate test coverage
               - Review test quality and edge cases
               - Check for missing test scenarios
               
            5. **Documentation**
               - Ensure code is properly documented
               - Verify README updates for new features
               - Check API documentation accuracy
               
            Use the GitHub MCP server tools to:
            - Get the PR details and diff
            - Create inline comments for specific issues
            - Add a progress tracking comment with checkboxes
            - Update the tracking comment when complete
            
            Provide detailed feedback using inline comments for specific issues.
            Use top-level comments for general observations or praise.
            "
