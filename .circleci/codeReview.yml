version: 2.1

workflows:
  pr-review-workflow:
    jobs:
      - pr-review-with-tracking:
          context: 
            - circleci-agents 

jobs:
  pr-review-with-tracking:
    docker:
      - image: cimg/python:3.11-node
    resource_class: medium
    steps:
      - checkout
       
      # Install Claude Code CLI 
      - run:
          name: Install Claude Code CLI
          command: |
            # Use the native installer like the docs recommend
            curl -fsSL https://claude.ai/install.sh | bash
            # Add to PATH for this session
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
            
      # Install GitHub CLI
      - run:
          name: Install GitHub CLI
          command: |
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh -y
      
      # Create .claude directory and settings
      - run:
          name: Setup Claude Code configuration
          command: |
            mkdir -p ~/.claude
            cat > ~/.claude/settings.json \<< 'EOF'
            {
              "mcpServers": {
                "github": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-github"],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "$GITHUB_PERSONAL_ACCESS_TOKEN"
                  }
                }
              }
            }
            EOF
            
      # Install the GitHub MCP server
      - run:
          name: Install GitHub MCP server
          command: |
            npm install -g @modelcontextprotocol/server-github
            
      # Authenticate GitHub CLI
      - run:
          name: Authenticate GitHub CLI
          command: |
            # Unset the automatic GITHUB_TOKEN to avoid conflicts
            unset GITHUB_TOKEN
            # Use our personal access token instead
            echo $GITHUB_PERSONAL_ACCESS_TOKEN | gh auth login --with-token
            
      # Run Claude Code for PR review
      - run:
          name: Run Claude Code PR Review
          command: |
            source $BASH_ENV
            
            PR_URL="<< pipeline.event.context.github.pr_url >>"
            echo "PR URL: $PR_URL"
            
            claude -p "
            Please perform a comprehensive code review of this GitHub Pull Request: $PR_URL
            
            Focus on these areas:
            
            1. **Code Quality**
               - Clean code principles and best practices
               - Proper error handling and edge cases
               - Code readability and maintainability
               
            2. **Security**
               - Check for potential security vulnerabilities
               - Validate input sanitization
               - Review authentication/authorization logic
               
            3. **Performance**
               - Identify potential performance bottlenecks
               - Review database queries for efficiency
               - Check for memory leaks or resource issues
               
            4. **Testing**
               - Verify adequate test coverage
               - Review test quality and edge cases
               - Check for missing test scenarios
               
            5. **Documentation**
               - Ensure code is properly documented
               - Verify README updates for new features
               - Check API documentation accuracy
               
            Use the GitHub MCP server tools to:
            - Get the PR details and diff
            - Create inline comments for specific issues
            - Add a progress tracking comment with checkboxes
            - Update the tracking comment when complete
            
            Provide detailed feedback using inline comments for specific issues.
            Use top-level comments for general observations or praise.
            "
            3. **Performance**
               - Identify potential performance bottlenecks
               - Review database queries for efficiency
               - Check for memory leaks or resource issues
               
            4. **Testing**
               - Verify adequate test coverage
               - Review test quality and edge cases
               - Check for missing test scenarios
               
            5. **Documentation**
               - Ensure code is properly documented
               - Verify README updates for new features
               - Check API documentation accuracy
               
            Use the GitHub MCP server tools to:
            - Get the PR details and diff
            - Create inline comments for specific issues
            - Add a progress tracking comment with checkboxes
            - Update the tracking comment when complete
            
            Provide detailed feedback using inline comments for specific issues.
            Use top-level comments for general observations or praise.
            "
